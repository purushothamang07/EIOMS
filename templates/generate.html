<!DOCTYPE html>
<html>

<head>

    <title>Generate Report</title>

    <meta charset="UTF-8">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>Generate Report</h3>

        </div>


        <div class="card-body">

            <div class="alert alert-info">

                <strong>Template:</strong>
                {{ template_name }}

            </div>


            <form method="POST" action="/generate">


                <!-- Google Drive Template ID -->

                <input
                    type="hidden"
                    name="template_id"
                    value="{{ template_id }}"
                >


                <!-- Placeholder fields -->

                {% for field in placeholders %}

                <div class="mb-3">

                    <label class="form-label">

                        <b>
                            {{ field.replace("_"," ").title() }}
                        </b>

                    </label>


                    {% if "address" in field.lower() %}

                    <textarea
                        class="form-control"
                        rows="4"
                        name="{{ field }}"
                        required
                    ></textarea>


                    {% elif "date" in field.lower() %}

                    <input
                        type="date"
                        class="form-control"
                        name="{{ field }}"
                        required
                    >


                    {% else %}

                    <input
                        type="text"
                        class="form-control"
                        name="{{ field }}"
                        required
                    >

                    {% endif %}

                </div>

                {% endfor %}


                <!-- Generate Button -->

                <button
                    type="submit"
                    class="btn btn-success"
                >

                    Generate {{ template_name }}

                </button>


            </form>

        </div>

    </div>

</div>

</body>

</html>
